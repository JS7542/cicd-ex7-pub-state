name: "Terraform CI/CD Pipeline"

# 1. 트리거 조건 설정 : 어떤 이벤트에서 워크플로우를 실행할지 지정
on:
  push:
    branches: [main]
  #   path:       # 배포 기준이 될 파일이 있는 위치(변경된 파일 기준)
  #   - 'infra/project/**'  
  # pull_request:
  #   branches: [main]
  #   path:
  #   - 'infra/project/**'  
  

# 2. 권한 설정 : (OpenID Coonnect 또는 시크릿 접근 권한)

permissions:
  contents: read

jobs:
  terraform:

# 3. 전체 작업에 대한 서버 구성 및 배포 설정 파일의 위치

    name: "Terraform Plan & Apply"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra/project

# 3 - 1. 소스 코드 체크아웃 : (체크아웃 : 저장소의 파일을 러너로 다운로드)

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

# 4. Terraform CLI 도구 설치

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.8.x

# 5. AWS 인증 정보 설정(GitHub Secrets 활용)

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-east-1
          audience: sts.amazonaws.com   # AWS STS 토큰을 사용할 때 필요한 audience 설정
          output-env-credentials: true  # 깃 허브 액션의 환경 변수 자동 저장

# 6. Terraform 초기화 (Provider 다운로드)

      - name: Terraform Init
        run: terraform init

# 7. Terraform 코드 포맷 검증
      - name: Terraform Validate
        run: terraform validate

# 8. 변경 사항 미리보기 (Plan)

      - name: Terraform Plan
        run: terraform plan -no-color   # 브라우저 출력시 색코드로 인한 글자 깨짐 방지
        continue-on-error: false        # Plan 단계에서 오류가 발생하면 워크플로우를 중단

# 9. 인프라 반영(Apply)

      - name: Terraform Apply & Destroy
        run: terraform apply --auto-approve  # Plan 단계에서 확인된 변경 사항을 자동으로 적용